<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — RAME!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> RAME!</a>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="login.html">Sudah punya akun</a>
    </div>
  </div>

  <div class="wrap wrap--narrow">
    <div class="card" style="margin-top:30px;">
      <h2>Daftar Akun</h2>
      <p style="color:var(--cream-dim); margin-top:-8px;">Gratis. Poin awal 0 — minta top up ke admin setelah daftar.</p>

      <form id="registerForm">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" placeholder="misal: budi123">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="email@contoh.com">

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="minimal 6 karakter">

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;" id="submitBtn">Daftar</button>
        <div class="err" id="errMsg" style="display:none;"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { registerUser } from "./js/auth.js";

    const form = document.getElementById("registerForm");
    const errMsg = document.getElementById("errMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Mendaftarkan...";
      try {
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        await registerUser(username, email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errMsg.textContent = friendlyError(err);
        errMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Daftar";
      }
    });

    function friendlyError(err) {
      const code = err.code || "";
      if (code.includes("email-already-in-use")) return "Email sudah terdaftar. Coba masuk.";
      if (code.includes("weak-password")) return "Password terlalu lemah, minimal 6 karakter.";
      if (code.includes("invalid-email")) return "Format email tidak valid.";
      if (code.includes("api-key") || code.includes("configuration")) return "Konfigurasi Firebase belum diisi. Lihat README.md.";
      return err.message || "Terjadi kesalahan. Coba lagi.";
    }
  </script>
</body>
</html>
